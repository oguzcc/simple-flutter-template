# This file is used to configure the Shorebird updater for Daisy app.
# Learn more at https://docs.shorebird.dev
# This file does not contain any sensitive information and should be checked into version control.

# Your app_id is the unique identifier assigned to your app.
# It is used to identify your app when requesting patches from Shorebird's servers.
# It is not a secret and can be shared publicly.

# Default app_id for Daisy (replace with actual ID from Shorebird Console)
app_id: daisy-app-id-placeholder

# Flavor-specific app IDs for different environments
flavors:
  development: daisy-dev-app-id-placeholder
  staging: daisy-staging-app-id-placeholder  
  production: daisy-prod-app-id-placeholder

# auto_update controls if Shorebird should automatically update in the background on launch.
# If auto_update: false, you will need to use package:shorebird_code_push to trigger updates.
# https://pub.dev/packages/shorebird_code_push
# For development, we disable auto_update to use manual control
auto_update: false

# Additional configuration for Daisy project
# These settings help with debugging and monitoring
allow_asset_diffs: true
allow_native_diffs: false