plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {

    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        development {
            dimension "flavor-type"
            applicationId "com.example.daisy.dev"
            resValue "string", "app_name", "Daisy [DEV]"
        }
        staging {
            dimension "flavor-type"
            applicationId "com.example.daisy.stg"
            resValue "string", "app_name", "Daisy [STG]"
        }
        production {
            dimension "flavor-type"
            applicationId "com.example.daisy"
            resValue "string", "app_name", "Daisy"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

   namespace = "com.example.daisy"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.daisy"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Configure release signing for production builds
            // 
            // CRITICAL: Currently using debug keys - this prevents publishing to Play Store!
            // 
            // To configure release signing:
            // 1. Create a keystore file:
            //    keytool -genkey -v -keystore ~/upload-keystore.jks -keyalg RSA \
            //            -keysize 2048 -validity 10000 -alias upload
            // 
            // 2. Create android/key.properties file with:
            //    storePassword=<password from step 1>
            //    keyPassword=<password from step 1>
            //    keyAlias=upload
            //    storeFile=<location of the key store file, e.g. /Users/USER_NAME/upload-keystore.jks>
            // 
            // 3. Add this code above android { block:
            //    def keystoreProperties = new Properties()
            //    def keystorePropertiesFile = rootProject.file('key.properties')
            //    if (keystorePropertiesFile.exists()) {
            //        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            //    }
            // 
            // 4. Add signingConfigs before buildTypes:
            //    signingConfigs {
            //        release {
            //            keyAlias keystoreProperties['keyAlias']
            //            keyPassword keystoreProperties['keyPassword']
            //            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            //            storePassword keystoreProperties['storePassword']
            //        }
            //    }
            // 
            // 5. Replace the line below with:
            //    signingConfig = signingConfigs.release
            // 
            // 6. Add key.properties to .gitignore
            // 
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
