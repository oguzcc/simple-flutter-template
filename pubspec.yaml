name: daisy
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_database: ^12.1.1
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1

  # State Management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.7

  # Routing
  go_router: ^17.0.1

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # UI & Design
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  wolt_modal_sheet: ^0.11.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1

  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # In-App Purchase
  purchases_flutter: ^9.10.2

  # Media & Files
  image_picker: ^1.2.1
  share_plus: ^13.0.0

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Device & System
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

  # Configuration & Environment
  flutter_dotenv: ^6.0.0

  # Functional Programming
  fpdart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality
  analyzer: ^10.0.1
  flutter_lints: ^6.0.0

  # Testing
  bloc_test: ^10.0.0
  mockito: ^5.6.1
  mocktail: ^1.0.4

  # Build & Configuration
  flutter_flavorizr: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/image/app_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  android: false
  ios: false
  web: false

  color: "#42a5f5"
  color_dark: "#042a49"

  background_image: "assets/image/logo/app_logo.png"
  background_image_dark: "assets/image/logo/app_logo.png"

  image: assets/image/logo/app_logo.png
  image_dark: assets/image/logo/app_logo.png

  branding: assets/image/logo/app_logo.png
  branding_dark: assets/image/logo/app_logo.png

  branding position:
  branding_mode: bottom # default bottom
  branding_bottom_padding: 24 # default 0
  branding_bottom_padding_android: 24 # default 0
  branding_bottom_padding_ios: 24 # default 0

  fullscreen: true # default false
  # if you dont want to hide notif bar, for android just set this to false,
  # but for ios, add this to your flutter main():
  # WidgetsFlutterBinding.ensureInitialized();
  # SystemChrome.setEnabledSystemUIMode(SystemUiMode.manual, overlays: [SystemUiOverlay.bottom, SystemUiOverlay.top], );

  #! extra note for IOS:
  # If you have changed the name(s) of your info.plist file(s), you can specify the filename(s)
  # with the info_plist_files parameter.  Remove only the # characters in the three lines below,
  # do not remove any spaces:
  #info_plist_files:
  #  - 'ios/Runner/Info-Debug.plist'
  #  - 'ios/Runner/Info-Release.plist'

  #========================================================================
  android_12:
    # background color
    color: "#42a5f5"
    color_dark: "#042a49"

    # center-logo
    # If this parameter is not specified, the app's launcher icon will be used instead.
    # Please note that the splash screen will be clipped to a circle on the center of the screen.
    # with background: 960×960 px (fit within circle 640px in diameter)
    # without background: 1152×1152 px (fit within circle 768px in diameter)
    # ensure that the most important design elements of your image are placed within a circular area
    image: assets/image/logo/app_logo.png
    image_dark: assets/image/logo/app_logo.png
    # center-logo background color
    icon_background_color: "#111111"
    icon_background_color_dark: "#eeeeee"

    branding: assets/image/logo/app_logo.png
    branding_dark: assets/image/logo/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/translation/
    - assets/video/
    - .env.development
    - .env.staging
    - .env.production
