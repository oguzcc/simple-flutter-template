name: daisy
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  dio: ^5.9.0
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_database: ^12.1.1
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3
  firebase_storage: ^13.0.5
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^19.5.0
  fpdart: ^1.2.0
  go_router: ^17.0.1
  google_fonts: ^6.3.3
  google_sign_in: ^7.2.0
  hydrated_bloc: ^10.1.1
  image_picker: ^1.2.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  purchases_flutter: ^9.10.2
  share_plus: ^12.0.1
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2
  wolt_modal_sheet: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: ^8.4.1
  bloc_test: ^10.0.0
  flutter_flavorizr: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mockito: ^5.6.1
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/image/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/translation/
    - assets/video/
    - .env.development
    - .env.staging
    - .env.production
