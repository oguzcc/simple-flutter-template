name: network_logger
description: A Flutter package for logging and inspecting HTTP network requests with Dio interceptor support.
version: 1.0.0
homepage: https://github.com/yourusername/network_logger

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true